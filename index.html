<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수수료 시뮬레이션(Excel) 따라하기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{box-sizing:border-box;--bg:#eef0f3;--panel:#fff;--ink:#1b1f27;--muted:#5d6574;--line:#d9dde4;--accent:#c8102e;--accent-soft:#fbe7ea;--ring:#ff3b5c;--f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161b;--panel:#1d2027;--ink:#e9ebef;--muted:#9aa2b1;--line:#323743;--accent:#ff5a6e;--accent-soft:#3a1d23;--ring:#ff5a6e}}
:root[data-theme="dark"]{--bg:#14161b;--panel:#1d2027;--ink:#e9ebef;--muted:#9aa2b1;--line:#323743;--accent:#ff5a6e;--accent-soft:#3a1d23;--ring:#ff5a6e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px}
[hidden]{display:none!important}
.shell{max-width:1720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 32px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between}
.bar h1{font-size:20px;margin:0;font-weight:700}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.stage{overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;min-width:0}
.coach{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.prog{display:flex;gap:3px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.d{background:var(--accent)}.prog i.c{background:var(--ring);opacity:.55}
.no{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.coach h2{font-size:18px;margin:2px 0 0;line-height:1.4}
.body{line-height:1.7}.body p{margin:0 0 8px}.body b{color:var(--ink)}.body mark{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 4px;border-radius:4px}
.tip{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}.tip strong{color:var(--ink)}
.calc{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.9}
.calc input{width:110px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--panel);color:var(--ink)}
.calc div div{display:flex;justify-content:space-between;border-top:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn[disabled]{opacity:.4;cursor:default}
.hint{font-size:12px;color:var(--muted)}.done{margin:0;padding-left:18px;line-height:1.8;font-size:13px}
@media (max-width:980px){.work{grid-template-columns:1fr}.coach{position:static;order:-1;max-height:none}}
/* Excel 재현 (라이트 고정) */
.scaler{position:relative}
.app{width:1140px;transform-origin:0 0;position:relative;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:12.5px;color:#222;background:#fff;color-scheme:light}
.app button{font-family:inherit}
.tt{background:#217346;color:#fff;padding:7px 12px;font-size:12px;display:flex;justify-content:space-between;height:30px}
.rtabs{background:#217346;display:flex;gap:2px;padding:0 8px}
.rtab{border:0;background:none;color:#fff;padding:6px 16px;font-size:12.5px;cursor:pointer;border-radius:4px 4px 0 0}
.rtab.on{background:#f3f3f3;color:#217346;font-weight:700}
.rib{background:#f3f3f3;border-bottom:1px solid #d4d4d4;height:62px;padding:8px 14px;position:relative;display:flex;gap:14px;align-items:flex-start}
.rbtn{border:1px solid transparent;background:none;padding:6px 14px;font-size:12px;cursor:pointer;border-radius:3px}.rbtn:hover{background:#e5e5e5}
.menu{position:absolute;left:14px;top:54px;width:230px;background:#fff;border:1px solid #bbb;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:9}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 14px;font-size:12.5px;cursor:pointer}.menu button:hover{background:#e8f3ec}
.pv{padding:7px 14px;display:flex;gap:10px;align-items:center;font-size:12px;background:#fff2cc;border-bottom:1px solid #e0c97a}
.pv u{text-decoration:underline;color:#0b5cad}
.pv button{border:1px solid #888;background:#f6f6f6;padding:3px 12px;font-size:12px;cursor:pointer;border-radius:3px}
.fx{display:flex;border-bottom:1px solid #d4d4d4;font-size:12px}.fx span{padding:4px 10px;border-right:1px solid #d4d4d4;color:#555}
table{border-collapse:collapse;table-layout:fixed;width:1140px}
td{border:1px solid #333;height:34px;padding:0 5px;text-align:center;font-size:12px;position:relative}
td.nt{border:0;text-align:left;color:#b4531a;font-size:11.5px;height:26px}
td.ttl{background:#002060;color:#fff;font-size:18px;font-weight:700;border-color:#002060}
td.rl{background:#7b1c2e;color:#fff;font-weight:700;border-color:#7b1c2e}
td.yel{background:#ff0;font-weight:700;font-size:14px}
td.gap{border:0}
td.hd{background:#2e9bcf;color:#fff;font-weight:700;border-color:#fff}
td.out{text-align:right;font-variant-numeric:tabular-nums;padding-right:8px}
td.dd{cursor:pointer;text-align:left}
td.dd.sel{outline:3px solid #217346;outline-offset:-2px}
.ar{display:none;position:absolute;right:-21px;bottom:-1px;width:20px;height:20px;background:#fff;border:1px solid #8a8a8a;font-size:9px;line-height:18px;text-align:center;cursor:pointer;z-index:4;color:#444}
td.sel .ar{display:block}td.sel{z-index:5}td.sel:not(.open) .ar::after{content:"◀ 이 단추를 누르세요";position:absolute;left:26px;top:0;white-space:nowrap;background:#c8102e;color:#fff;font-size:11px;line-height:20px;padding:0 8px;border-radius:4px;font-weight:700}
.list{position:absolute;left:0;top:100%;min-width:100%;max-height:264px;overflow-y:scroll;background:#fff;border:1px solid #777;box-shadow:0 4px 10px rgba(0,0,0,.25);z-index:8;display:none;text-align:left}
td.open .list{display:block}
.list button{display:block;width:100%;text-align:left;border:0;background:none;padding:3px 10px;font-size:14px;cursor:pointer;white-space:nowrap;color:#222}.list button:hover,.list button.cur{background:#d4d4d4}
.sheet{background:#f3f3f3;border-top:1px solid #d4d4d4;padding:4px 12px;font-size:12px;margin-top:190px}
.sheet span{background:#fff;border-bottom:2px solid #217346;padding:4px 14px;font-weight:700;color:#217346}
.bs{position:absolute;left:0;right:0;top:30px;bottom:0;display:flex;z-index:20;background:#fff}
.bs nav{width:200px;background:#217346;color:#fff;padding:10px 0}
.bs nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#fff;padding:10px 20px;font-size:13px;cursor:pointer}
.bs nav button:hover{background:rgba(255,255,255,.15)}
.bs main{flex:1;padding:30px 40px;font-size:13px;color:#444}
.bs h3{margin:0 0 14px;font-size:22px;font-weight:400;color:#222}
.ver{border:1px solid #bbb;padding:16px 18px;max-width:420px;line-height:1.8}.ver b{font-size:16px;color:#217346}
.hl{outline:3px solid var(--ring)!important;outline-offset:2px;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{outline-color:transparent}}
.ddp span{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:12px;margin:0 4px 4px 0}.ddp span.on{background:rgba(31,138,76,.18);color:#2fa862;font-weight:600}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer}
.qr{display:flex;gap:12px;align-items:center;margin:8px 0}.qr a{color:var(--accent);font-weight:600}.qrbox{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line)}.qrbox svg{width:110px;height:110px;display:block}
.fee{margin:0 0 8px;font-size:13px;line-height:1.6}.fee dt{font-weight:700;margin-top:6px}.fee dd{margin:0;color:var(--muted)}.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:50}
</style></head>
<body><div class="shell">
<div class="bar"><div><h1>수수료 시뮬레이션(Excel) 따라하기</h1><div class="sub">화면을 직접 눌러 보며 사용 순서를 익혀 보세요. (연습용 화면 · 예시 숫자)</div></div><span class="pill">연습 모드</span></div>
<div class="work">
<div class="stage" id="stageW"><div class="scaler" id="scaler"><div class="app" id="app">
 <div class="tt"><span>수수료 시뮬레이션.xlsx - Excel</span><span>— ▢ ✕</span></div>
 <div class="rtabs"><button class="rtab" id="tab-file" data-t="file">파일</button><button class="rtab on" data-t="home">홈</button><button class="rtab" data-t="insert">삽입</button><button class="rtab" id="tab-formula" data-t="formula">수식</button><button class="rtab" data-t="data">데이터</button></div>
 <div class="rib"><span id="rb-home" style="color:#777;font-size:12px">붙여넣기 · 글꼴 · 맞춤 · 표시 형식</span><button class="rbtn" id="calcbtn" hidden>계산 옵션 ▾</button>
  <div class="menu" id="menu" hidden><button id="opt-auto">✔ 자동</button><button class="o2">&nbsp;&nbsp;&nbsp;데이터 표만 제외하고 자동</button><button class="o2">&nbsp;&nbsp;&nbsp;수동</button></div></div>
 <div class="pv" id="pv0"><span>⚠ 보호된 보기</span><span>편집하면 안전하지 않을 수 있습니다.</span><button id="pv-btn1">편집 사용</button></div>
 <div class="pv" id="pv1" hidden><span>⚠ 보안 경고</span><span>외부 데이터 연결을 사용할 수 없도록 설정했습니다.</span><button id="pv-btn2">콘텐츠 사용</button></div>
 <div class="fx"><span>D8</span><span>fx</span></div>
 <table id="tb"></table>
 <div class="sheet"><span>시뮬레이션</span></div>
 <div class="bs" id="bs" hidden><nav><button id="bs-back">⬅</button><button class="bi">홈</button><button class="bi">새로 만들기</button><button class="bi">열기</button><button class="bi">정보</button><button id="m-acct">계정</button><button class="bi">옵션</button></nav>
  <main id="bs-main"></main></div>
</div></div></div>
<aside class="coach"><div class="prog" id="prog"></div><div><div class="no" id="no"></div><h2 id="t"></h2></div><div class="body" id="b"></div><div class="tip" id="tip"></div>
<div class="btns"><button class="btn" id="prev">이전</button><button class="btn p" id="next">다음</button><button class="btn" id="reset">처음부터</button></div><div class="hint" id="hint"></div></aside>
</div></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var TYP=['손해','생명','(없음)'],INS=[['DB손해보험','KB손해보험','NH농협손해보험','라이나손보(장기)','롯데손해보험','메리츠화재','삼성화재','하나손해보험','한화손해보험','현대해상','흥국화재'],['ABL생명','DB생명','IBK연금보험','IM라이프','KB라이프','KDB생명','METLIFE생명','NH농협생명','교보생명','동양생명','라이나생명','미래에셋생명','삼성생명','신한라이프']],RATES=[70,75,85,87,90,92,95,100],
PR=[['(예시) 건강보험 A [주] 5년납',[300,40,50,90,45,0,0,0]],['(예시) 건강보험 A [주] 10년납',[360,50,60,100,80,10,0,0]],['(예시) 건강보험 A [주] 15년납',[420,60,70,110,150,20,0,0]],['(예시) 건강보험 B [주] 5년납',[280,35,45,85,40,0,0,0]],['(예시) 건강보험 C [주] 5년납',[330,45,55,95,50,0,0,0]]];
var S,cur=0,guard=false,tt;
function init(){S={pv:0,file:0,acct:0,tab:'home',menu:0,sn:-1,ins:-1,prod:-1,rate:100,sel:'',open:'',ex:[null,null]}}init();
function toast(m){var e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2600)}
function fm(x){return x?x.toFixed(1):'-'}
function fn(n){return Math.round(n).toLocaleString('ko-KR')}
/* 표 생성 */
function ddc(id){return '<td class="dd" id="c-'+id+'"><span id="v-'+id+'"></span><b class="ar" id="ar-'+id+'">▼</b><div class="list" id="l-'+id+'"></div></td>'}
var W=[34,56,120,260,64,64,60,64,64,60,56,56,56,62,64],h='<colgroup>'+W.map(function(w){return '<col style="width:'+w+'px">'}).join('')+'</colgroup>';
h+='<tr><td class="nt" colspan="15">※본 자료는 참고용입니다. 실제 지급수수료와 차이가 발생할 수 있으며, 지급을 보증하지 않습니다.</td></tr>';
h+='<tr><td class="nt" colspan="15">※자주 업데이트 되오니, 자료 사용하실 때마다 다운로드를 통한 최신화 부탁드립니다.</td></tr>';
h+='<tr><td class="ttl" colspan="4" rowspan="2">더블유에셋 수수료 시뮬레이션</td><td class="rl">지급율 ▶</td>'+ddc('rate').replace('class="dd"','class="dd yel" colspan="2"')+'<td class="gap" colspan="8"></td></tr>';
h+='<tr><td class="hd" colspan="2">1차년</td><td class="hd" rowspan="2">합계</td><td class="hd" colspan="2">2차년</td><td class="hd" rowspan="2">합계</td><td class="hd" colspan="4">3차년 이후</td><td class="hd" rowspan="2">총계</td></tr>';
h+='<tr>'+['No.','생/손','보험사명','상품명','익월_FC','1차년_FC'].map(function(x){return '<td class="hd">'+x+'</td>'}).join('')+['13회차_FC','2차년_FC'].map(function(x){return '<td class="hd">'+x+'</td>'}).join('')+['3차년_FC','4차년_FC','5차년_FC','6차년이후_FC'].map(function(x){return '<td class="hd">'+x+'</td>'}).join('')+'</tr>';
var oc=function(r,n){return '<td class="out" id="'+(r?'p'+r+'_'+n:'o'+n)+'"></td>'};
for(var r=0;r<3;r++){h+='<tr><td>'+(r+1)+'</td>'+(r?'<td id="x'+r+'a"></td><td id="x'+r+'b"></td><td id="x'+r+'c"></td>':ddc('sn')+ddc('ins')+ddc('prod'))+oc(r,0)+oc(r,1)+oc(r,2)+oc(r,3)+oc(r,4)+oc(r,5)+oc(r,6)+oc(r,7)+oc(r,8)+oc(r,9)+oc(r,10)+'</tr>'}
$('#tb').innerHTML=h;
/* 상태 → 화면 */
function items(id){if(id==='sn')return TYP;if(id==='ins')return S.sn>=0&&S.sn<2?INS[S.sn]:['먼저 생/손을 선택하세요'];if(id==='prod')return S.ins>=0?PR.map(function(p){return p[0]}):['먼저 보험사명을 선택하세요'];return RATES.map(function(x){return x+'%'})}
function render(){
 $('#pv0').hidden=S.pv!==0;$('#pv1').hidden=S.pv!==1;
 $('#bs').hidden=!S.file;
 $('#bs-main').innerHTML=S.acct?'<h3>계정</h3><div class="ver" id="acct-box"><div style="color:#777">제품 정보</div><b>Microsoft Office Professional Plus 2021</b><div>Excel 정보 · 버전 2021 (예시 화면)</div></div>':'<h3>계정</h3><div>왼쪽 메뉴에서 <b>계정</b>을 눌러 주세요.</div>';
 document.querySelectorAll('.rtab').forEach(function(b){b.classList.toggle('on',b.dataset.t===S.tab)});
 $('#rb-home').hidden=S.tab!=='home';$('#calcbtn').hidden=S.tab!=='formula';$('#menu').hidden=!(S.menu&&S.tab==='formula');
 ['sn','ins','prod','rate'].forEach(function(id){var td=$('#c-'+id);td.classList.toggle('sel',S.sel===id);td.classList.toggle('open',S.open===id);
  $('#l-'+id).innerHTML=items(id).map(function(t,i){return '<button class="'+(i===(id==='sn'?S.sn:id==='ins'?S.ins:id==='prod'?S.prod:RATES.indexOf(S.rate))?'cur':'')+'" id="it-'+id+'-'+i+'" data-k="'+id+'" data-i="'+i+'">'+t+'</button>'}).join('')});
 $('#v-sn').textContent=S.sn>=0?TYP[S.sn]:'';$('#v-ins').textContent=S.ins>=0?INS[S.sn][S.ins]:'';$('#v-prod').textContent=S.prod>=0?PR[S.prod][0]:'';$('#v-rate').textContent=S.rate+'%';
 
 var ok=S.ins>=0&&S.prod>=0,o=ok?calc(S.prod):[];
 
 for(var n=0;n<11;n++)$('#o'+n).textContent=ok?fm(o[n]):'';
 S.o=o;exr();wg();hl();lab();ddp();
}
function lab(){var s=steps[cur];if(!s)return;var go2=s.act&&!(s.hold&&S.acct);$('#next').textContent=go2?'대신 눌러 주기':'다음';$('#hint').textContent=go2?'직접 눌러 보거나, [대신 눌러 주기]로 넘어갈 수 있습니다.':(s.hold?'버전 문구를 확인한 뒤 [다음]을 누르세요.':'')}
function hl(){document.querySelectorAll('.hl').forEach(function(e){e.classList.remove('hl')});var s=steps[cur];if(!s||!s.tg)return;var el=$(typeof s.tg==='function'?s.tg():s.tg);if(el)el.classList.add('hl')}
function ddt(id,i){return function(){return S.open===id?'#it-'+id+'-'+i:S.sel===id?'#ar-'+id:'#c-'+id}}
